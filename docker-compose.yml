# Hệ thống Quản lý Cửa hàng / POS — DTC245200279
# Chạy:  docker compose up -d --build
name: pos-dtc245200279

# Cấu hình dùng chung
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  restart: unless-stopped

services:
  # ---------- Sinh chứng chỉ HTTPS tự ký + basic auth Prometheus (chạy rồi thoát) ----------
  certgen:
    image: alpine:3.20
    command: ["sh", "-c", "sh /generate-cert.sh && sh /generate-htpasswd.sh"]
    environment:
      PROMETHEUS_USER: ${PROMETHEUS_USER:?Thiếu PROMETHEUS_USER trong .env}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD:?Thiếu PROMETHEUS_PASSWORD trong .env}
    volumes:
      - ./nginx/generate-cert.sh:/generate-cert.sh:ro
      - ./nginx/generate-htpasswd.sh:/generate-htpasswd.sh:ro
      - ./nginx/certs:/certs
      - ./nginx/auth:/auth
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: "no"

  # ---------- Nginx reverse proxy (HTTPS + security headers) ----------
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [frontend, monitoring]
    depends_on:
      certgen:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      phpmyadmin:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  # ---------- Ứng dụng POS (Node.js / Express) ----------
  app:
    <<: *hardening
    build: ./app
    image: pos-app:1.0
    user: "1000:1000"
    init: true
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?Thiếu MYSQL_DATABASE trong .env}
      DB_USER: ${APP_DB_USER:?Thiếu APP_DB_USER trong .env}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Thiếu APP_DB_PASSWORD trong .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [frontend, backend, monitoring]
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ---------- MySQL (KHÔNG publish port ra host) ----------
  mysql:
    <<: *hardening
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
      - --local-infile=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env}
      # root chỉ đăng nhập được từ bên trong container (không đăng nhập root qua mạng)
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # Dùng tên biến riêng (không phải MYSQL_USER) để user app KHÔNG được cấp ALL PRIVILEGES mặc định;
      # quyền tối thiểu được cấp trong mysql/init/03-app-user.sh
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # User chỉ đọc trạng thái cho mysqld-exporter (mysql/init/04-exporter-user.sh)
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:?Thiếu MYSQL_EXPORTER_USER trong .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Thiếu MYSQL_EXPORTER_PASSWORD trong .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      # Ping qua TCP: lúc khởi tạo MySQL tắt networking nên chỉ "healthy" khi server thật đã sẵn sàng
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ---------- phpMyAdmin (truy cập qua https://localhost/phpmyadmin/) ----------
  phpmyadmin:
    <<: *hardening
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/phpmyadmin/
      UPLOAD_LIMIT: 2M
      HIDE_PHP_VERSION: "true"
    networks: [frontend, backend]
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ================= GIÁM SÁT: Prometheus + Grafana + exporters =================

  # ---------- Prometheus (https://localhost/prometheus/, có basic auth) ----------
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.4.0
    user: "65534:65534"   # nobody
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=https://localhost/prometheus/
      - --web.route-prefix=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    cap_drop: [ALL]
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/prometheus/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # ---------- Grafana (https://localhost/grafana/) ----------
  grafana:
    <<: *hardening
    image: grafana/grafana:11.6.0
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Thiếu GRAFANA_ADMIN_USER trong .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Thiếu GRAFANA_ADMIN_PASSWORD trong .env}
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Mạng monitoring không ra Internet -> tắt tự cài plugin / tải khóa ký plugin
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pos-overview.json
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [monitoring]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ---------- cAdvisor: metrics CPU/RAM/network của từng container ----------
  # Ngoại lệ hardening: cần privileged + mount /sys, /var/lib/docker (chỉ đọc) để đọc cgroup của Docker.
  # Không publish port, chỉ nằm trong mạng monitoring nội bộ.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process,advtcp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ---------- nginx-exporter: đọc stub_status (cổng nội bộ 8081) của Nginx ----------
  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.4.2
    user: "65534:65534"
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    read_only: true
    cap_drop: [ALL]
    networks: [monitoring]
    depends_on:
      - nginx
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 64M }

  # ---------- mysqld-exporter: metrics MySQL bằng user chỉ đọc trạng thái ----------
  mysqld-exporter:
    <<: *hardening
    image: prom/mysqld-exporter:v0.17.2
    user: "65534:65534"
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${MYSQL_EXPORTER_USER}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    read_only: true
    cap_drop: [ALL]
    # Nằm ở cả backend (để tới MySQL) và monitoring (để Prometheus scrape)
    networks: [backend, monitoring]
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 64M }

  # ================= LOG TẬP TRUNG & CẢNH BÁO: Loki + Promtail + Alertmanager =================

  # ---------- Loki: lưu trữ log tập trung + ruler chạy luật cảnh báo bảo mật (LogQL) ----------
  loki:
    <<: *hardening
    image: grafana/loki:3.5.0
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./monitoring/loki/rules:/etc/loki/rules/fake:ro
      - loki_data:/loki
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready | grep -q ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # ---------- Promtail: thu log mọi container của project và đẩy về Loki ----------
  # Cần đọc Docker socket (chỉ đọc) để tự phát hiện container và đọc log stdout/stderr.
  promtail:
    <<: *hardening
    image: grafana/promtail:3.5.0
    user: "0:0"   # cần quyền đọc /var/run/docker.sock
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/var/lib/promtail
    read_only: true
    cap_drop: [ALL]
    networks: [monitoring]
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.30", memory: 128M }

  # ---------- Alertmanager: nhận alert (Prometheus + Loki), gửi Telegram ----------
  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.28.1
    user: "65534:65534"
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # monitoring (nhận alert từ Prometheus/Loki) + egress (ra Internet CHỈ để gửi Telegram)
    networks: [monitoring, egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/alertmanager/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 128M }

networks:
  # Mạng phía ngoài: Nginx <-> app / phpMyAdmin
  frontend:
    driver: bridge
  # Mạng nội bộ: chỉ app / phpMyAdmin / mysqld-exporter <-> MySQL, không ra Internet
  backend:
    driver: bridge
    internal: true
  # Mạng giám sát nội bộ: Prometheus, Grafana, exporters; không ra Internet, không publish port
  monitoring:
    driver: bridge
    internal: true
  # Mạng CHỈ để Alertmanager ra Internet gửi cảnh báo Telegram (duy nhất service có egress)
  egress:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
  alertmanager_data:
