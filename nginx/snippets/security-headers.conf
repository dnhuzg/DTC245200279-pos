# Security headers dùng chung (include trong từng location vì add_header
# trong location sẽ GHI ĐÈ toàn bộ add_header kế thừa từ server).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
# HSTS: bật khi dùng domain thật + chứng chỉ hợp lệ. Với localhost + chứng chỉ tự ký
# không bật để tránh trình duyệt "nhớ" ép HTTPS cho mọi dịch vụ localhost khác.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
