# Nginx reverse proxy cho hệ thống POS
# Image nginx-unprivileged chạy non-root (uid 101) nên lắng nghe cổng > 1024:
#   8080 (HTTP, chỉ để chuyển hướng) và 8443 (HTTPS). docker-compose map 80->8080, 443->8443.

# Ẩn phiên bản Nginx trong header "Server" và trang lỗi
server_tokens off;

# Giới hạn tốc độ gọi API theo IP (chống spam / brute force cơ bản)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

# DNS nội bộ của Docker. Tham số "resolve" giúp Nginx tự cập nhật IP khi một container
# được tạo lại (IP đổi) mà không phải restart Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream pos_app {
    zone pos_app 64k;
    server app:3000 resolve;
    keepalive 16;
}

upstream pma {
    zone pma 64k;
    server phpmyadmin:80 resolve;
}

upstream grafana {
    zone grafana 64k;
    server grafana:3000 resolve;
}

upstream prometheus {
    zone prometheus 64k;
    server prometheus:9090 resolve;
}

# Header Connection cho WebSocket (Grafana Live)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ---------- Metrics nội bộ cho nginx-prometheus-exporter ----------
# Cổng 8081 KHÔNG publish ra host; chỉ container trong mạng Docker gọi được.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    location / {
        return 404;
    }
}

# ---------- HTTP -> HTTPS ----------
server {
    listen 8080;
    server_name _;

    # Dùng cho healthcheck của Docker (gọi từ bên trong container)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # Redirect tương đối: tránh lộ cổng nội bộ 8443 trong header Location
    absolute_redirect off;

    # Header chung cho mọi request đi qua proxy
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 30s;

    # ---- Ứng dụng POS ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # CSP chặt cho app: chỉ cho phép script/style/ảnh từ chính domain (không inline script)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        proxy_pass http://pos_app;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://pos_app;
    }

    # ---- phpMyAdmin (công cụ quản lý DB) qua đường dẫn /phpmyadmin/ ----
    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }
    location /phpmyadmin/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Dấu "/" cuối proxy_pass: bỏ tiền tố /phpmyadmin/ trước khi chuyển vào container
        proxy_pass http://pma/;
        # phpMyAdmin tự gửi các header bảo mật riêng -> ẩn bản trùng
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Robots-Tag;
    }

    # ---- Grafana (dashboard giám sát) qua /grafana/ ----
    # Grafana cấu hình serve_from_sub_path nên giữ nguyên tiền tố /grafana/
    location /grafana/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_pass http://grafana;
    }
    location /grafana/api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_pass http://grafana;
    }

    # ---- Prometheus UI qua /prometheus/ — Prometheus không có đăng nhập nên bảo vệ bằng basic auth ----
    location /prometheus/ {
        include /etc/nginx/snippets/security-headers.conf;
        auth_basic           "Prometheus";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://prometheus;
    }

    # Metrics của app chỉ cho Prometheus scrape nội bộ, không cho truy cập từ ngoài
    location = /metrics {
        return 404;
    }

    # Chặn truy cập file ẩn (.env, .git, ...)
    location ~ /\.(?!well-known) {
        return 404;
    }
}
