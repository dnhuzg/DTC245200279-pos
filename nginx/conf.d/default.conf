# Nginx reverse proxy cho hệ thống POS
# Image nginx-unprivileged chạy non-root (uid 101) nên lắng nghe cổng > 1024:
#   8080 (HTTP, chỉ để chuyển hướng) và 8443 (HTTPS). docker-compose map 80->8080, 443->8443.

# Ẩn phiên bản Nginx trong header "Server" và trang lỗi
server_tokens off;

# Giới hạn tốc độ gọi API theo IP (chống spam / brute force cơ bản)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

upstream pos_app {
    server app:3000;
    keepalive 16;
}

upstream pma {
    server phpmyadmin:80;
}

# ---------- HTTP -> HTTPS ----------
server {
    listen 8080;
    server_name _;

    # Dùng cho healthcheck của Docker (gọi từ bên trong container)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # Redirect tương đối: tránh lộ cổng nội bộ 8443 trong header Location
    absolute_redirect off;

    # Header chung cho mọi request đi qua proxy
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 30s;

    # ---- Ứng dụng POS ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # CSP chặt cho app: chỉ cho phép script/style/ảnh từ chính domain (không inline script)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        proxy_pass http://pos_app;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://pos_app;
    }

    # ---- phpMyAdmin (công cụ quản lý DB) qua đường dẫn /phpmyadmin/ ----
    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }
    location /phpmyadmin/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Dấu "/" cuối proxy_pass: bỏ tiền tố /phpmyadmin/ trước khi chuyển vào container
        proxy_pass http://pma/;
        # phpMyAdmin tự gửi các header bảo mật riêng -> ẩn bản trùng
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Robots-Tag;
    }

    # Chặn truy cập file ẩn (.env, .git, ...)
    location ~ /\.(?!well-known) {
        return 404;
    }
}
